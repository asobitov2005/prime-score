services:
  api:
    entrypoint: ["sh", "/app/docker-entrypoint.sh"]
    command:
      [
        "python",
        "/app/dev_autoreload.py",
        "--",
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      RUN_DB_MIGRATIONS: "1"
      RUN_APP_SEED: "1"
    volumes:
      - ./backend:/app

  worker:
    entrypoint: ["sh", "/app/docker-entrypoint.sh"]
    command:
      [
        "python",
        "/app/dev_autoreload.py",
        "--",
        "celery",
        "-A",
        "app.tasks.celery_app",
        "worker",
        "--loglevel=info",
        "-Q",
        "default,heavy,notifications,admin_ai,writing",
        "--concurrency=4",
        "-Ofair",
      ]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      RUN_APP_BOOTSTRAP: "0"
    volumes:
      - ./backend:/app

  beat:
    entrypoint: ["sh", "/app/docker-entrypoint.sh"]
    command:
      [
        "python",
        "/app/dev_autoreload.py",
        "--",
        "celery",
        "-A",
        "app.tasks.celery_app",
        "beat",
        "--loglevel=info",
      ]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      RUN_APP_BOOTSTRAP: "0"
    volumes:
      - ./backend:/app

  bot:
    entrypoint: ["sh", "/app/docker-entrypoint.sh"]
    command:
      ["python", "/app/dev_autoreload.py", "--", "python", "-m", "app.bot.main"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      RUN_APP_BOOTSTRAP: "0"
    volumes:
      - ./backend:/app

  payment-detector:
    entrypoint: ["sh", "/app/docker-entrypoint.sh"]
    command:
      ["python", "/app/dev_autoreload.py", "--", "python", "-m", "app.scripts.payment_detector"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      RUN_APP_BOOTSTRAP: "0"
      TELEGRAM_SESSION_PATH: /var/lib/primescore/telegram/payment_detector
    volumes:
      - ./backend:/app
      - telegram_session_data:/var/lib/primescore/telegram

  frontend:
    build:
      context: ./frontend
      target: deps
    command:
      [
        "./node_modules/.bin/next",
        "dev",
        "--hostname",
        "0.0.0.0",
        "--port",
        "3000",
      ]
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next

  admin:
    build:
      context: ./admin
      target: deps
    command:
      [
        "./node_modules/.bin/next",
        "dev",
        "--hostname",
        "0.0.0.0",
        "--port",
        "3001",
      ]
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
      - admin_next_cache:/app/.next

volumes:
  redis_data:
  telegram_session_data:
  frontend_node_modules:
  frontend_next_cache:
  admin_node_modules:
  admin_next_cache:
