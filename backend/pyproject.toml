[project]
name = "primescore-backend"
version = "0.1.0"
description = "PrimeScore FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.7.0,<4.0.0",
  "alembic>=1.13.2,<2.0.0",
  "asyncpg>=0.29.0,<1.0.0",
  "bcrypt>=4.1.3,<6.0.0",
  "celery[redis]>=5.4.0,<6.0.0",
  "fastapi>=0.111.0,<1.0.0",
  "google-genai>=1.73.0,<2.0.0",
  "minio>=7.2.20,<8.0.0",
  "pydantic-settings>=2.4.0,<3.0.0",
  "python-multipart>=0.0.20,<1.0.0",
  "python-jose[cryptography]>=3.3.0,<4.0.0",
  "redis>=5.0.7,<6.0.0",
  "sqlalchemy>=2.0.31,<3.0.0",
  "telethon>=1.43.0,<2.0.0",
  "uvicorn[standard]>=0.30.1,<1.0.0",
]

[project.scripts]
primescore-create-admin = "app.db.create_admin:main"
primescore-payment-detector = "app.scripts.payment_detector:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0,<1.0.0",
  "pytest>=8.2.2,<9.0.0",
  "pytest-asyncio>=0.23.7,<1.0.0",
  "ruff>=0.5.1,<1.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
