name: Ruff autofix

on:
  push:
    branches:
      - "refactor/**"

permissions:
  contents: write

concurrency:
  group: ruff-autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply compatibility patches
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime_store = Path("backend/app/services/runtime_store.py")
          runtime_text = runtime_store.read_text()
          import_line = "from app.services.attempt_runtime import AttemptRuntime, _band_for_raw_score\n"
          export_block = import_line + "\nband_for_raw_score = _band_for_raw_score\n"
          if "band_for_raw_score = _band_for_raw_score" not in runtime_text:
              if import_line not in runtime_text:
                  raise SystemExit("runtime_store import marker not found")
              runtime_store.write_text(runtime_text.replace(import_line, export_block, 1))

          writing_checker = Path("backend/app/services/writing_checker.py")
          writing_text = writing_checker.read_text()
          unused_block = '''    generated_next_steps = [
              _trim_sentence(step, limit=180)
              for step in grader.next_steps
              if _clean_text(step)
          ]
          '''
          if unused_block in writing_text:
              writing_checker.write_text(writing_text.replace(unused_block, "", 1))
          PY
      - name: Install Ruff
        run: python -m pip install "ruff>=0.5.1,<1.0.0"
      - name: Apply safe fixes
        working-directory: backend
        run: ruff check app tests --fix || true
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No compatibility or Ruff changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "fix: restore compatibility exports and clean lint"
          git push origin HEAD:${{ github.ref_name }}
