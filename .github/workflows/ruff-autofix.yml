name: Ruff autofix

on:
  push:
    branches:
      - "refactor/**"

permissions:
  contents: write

concurrency:
  group: ruff-autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply compatibility patches
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          runtime_store = Path("backend/app/services/runtime_store.py")
          runtime_text = runtime_store.read_text()
          runtime_alias = (
              "from app.services.attempt_runtime import AttemptRuntime, "
              "_band_for_raw_score as band_for_raw_score  # noqa: F401\n"
          )
          for old_import in (
              "from app.services.attempt_runtime import AttemptRuntime, _band_for_raw_score\n\nband_for_raw_score = _band_for_raw_score\n",
              "from app.services.attempt_runtime import AttemptRuntime, _band_for_raw_score as band_for_raw_score\n",
              "from app.services.attempt_runtime import (\n    AttemptRuntime,\n    _band_for_raw_score as band_for_raw_score,\n)\n",
              "from app.services.attempt_runtime import (\n    AttemptRuntime,\n)\n",
          ):
              runtime_text = runtime_text.replace(old_import, runtime_alias, 1)
          runtime_store.write_text(runtime_text)

          writing_checker = Path("backend/app/services/writing_checker.py")
          writing_text = writing_checker.read_text()
          writing_text = re.sub(
              r"\n    generated_next_steps = \[\n"
              r"        _trim_sentence\(step, limit=180\)\n"
              r"        for step in grader\.next_steps\n"
              r"        if _clean_text\(step\)\n"
              r"    \]\n",
              "\n",
              writing_text,
              count=1,
          )
          writing_checker.write_text(writing_text)

          speaking_test = Path("backend/tests/test_speaking_user_api.py")
          speaking_text = speaking_test.read_text().replace(
              'monkeypatch.setattr("app.api.routes.speaking.resolve_ai_use_case_config", _fake_resolve_ai_use_case_config)',
              'monkeypatch.setattr("app.api.routes.speaking_sessions.resolve_ai_use_case_config", _fake_resolve_ai_use_case_config)',
              1,
          )
          speaking_test.write_text(speaking_text)
          PY
      - name: Install Ruff
        run: python -m pip install "ruff>=0.5.1,<1.0.0"
      - name: Apply safe fixes
        working-directory: backend
        run: ruff check app tests --fix || true
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No compatibility or Ruff changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "fix: complete refactor compatibility cleanup"
          git push origin HEAD:${{ github.ref_name }}
