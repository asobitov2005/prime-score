name: Ruff autofix

on:
  push:
    branches:
      - "refactor/**"

permissions:
  contents: write

concurrency:
  group: ruff-autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.5.1,<1.0.0"
      - name: Apply safe fixes
        working-directory: backend
        run: ruff check app tests --fix
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No Ruff changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "style: apply safe Ruff fixes"
          git push origin HEAD:${{ github.ref_name }}
