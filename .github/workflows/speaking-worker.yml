name: Speaking architecture worker

on:
  push:
    branches:
      - worker/speaking-final

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install TypeScript toolchain
        working-directory: frontend
        run: npm ci
      - name: Configure speaking target
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("scripts/refactor_medium_ui_architecture.cjs")
          text = path.read_text()
          targets = '''const TARGETS = [
            "frontend/app/(app)/speaking/speaking-page-client.tsx",
          ];'''
          text = re.sub(
              r"const TARGETS = \[.*?\n\];",
              targets,
              text,
              count=1,
              flags=re.S,
          )
          text = text.replace("const MAX_BODY_LINES = 220;", "const MAX_BODY_LINES = 285;")
          text = text.replace(
              "const controllerParts = packGroups(controllerUnits, groups, 255);",
              "const controllerParts = packGroups(controllerUnits, groups, 285);",
          )
          text = text.replace(
              "if (lineCount(nodeText) > 210 && children.length > 1) {",
              "if (lineCount(nodeText) > 175 && children.length > 0) {",
          )
          text = text.replace(
              'if (lineCount(childText) < 35 && lineCount(nodeText) < 280) continue;',
              'if (lineCount(childText) < 16 && lineCount(nodeText) < 260) continue;',
          )
          text = text.replace(
              "if (lineCount(nodeText) > 235) {",
              "if (lineCount(nodeText) > 275) {",
          )
          path.write_text(text)
          PY
      - name: Split speaking modules
        run: node scripts/refactor_medium_ui_architecture.cjs
      - name: Commit worker result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend artifacts/medium-ui-architecture-report.tsv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor(speaking): split live session and views"
          git push origin HEAD:${{ github.ref_name }}
