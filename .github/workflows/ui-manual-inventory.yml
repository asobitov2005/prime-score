name: Remaining UI component map

on:
  push:
    branches:
      - refactor/ui-manual-components-batch-4

permissions:
  contents: write

jobs:
  map:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install TypeScript toolchain
        working-directory: frontend
        run: npm ci
      - name: Map large component bodies
        run: node scripts/map_large_component_bodies.cjs
      - name: Commit map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/large-component-bodies.tsv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: map remaining large component bodies"
          git push origin HEAD:${{ github.ref_name }}
