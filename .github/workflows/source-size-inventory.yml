name: Backend module splitter

on:
  push:
    branches:
      - refactor/modularize-remaining-large-files

permissions:
  contents: write

jobs:
  split:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Split configured modules
        run: python scripts/split_python_modules.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend artifacts/python-split-report.tsv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor(backend): split large Python modules"
          git push origin HEAD:${{ github.ref_name }}
