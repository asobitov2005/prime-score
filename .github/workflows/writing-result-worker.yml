name: Writing result worker

on:
  push:
    branches:
      - worker/writing-result-final

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]' || github.event.head_commit.message == 'kick worker'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install TypeScript toolchain
        working-directory: frontend
        run: npm ci
      - name: Prepare state and ready view
        id: prepare
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          node scripts/prepare_writing_result_refactor.cjs > artifacts/writing-result-prep.log 2>&1
          status=$?
          cat artifacts/writing-result-prep.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Configure architecture targets
        if: steps.prepare.outputs.status == '0'
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("scripts/refactor_medium_ui_architecture.cjs")
          text = path.read_text()
          targets = '''const TARGETS = [
            "frontend/app/(app)/writing/submissions/[submissionId]/result/result-client.tsx",
            "frontend/app/(app)/writing/submissions/[submissionId]/result/writing-result-ready-view.tsx",
          ];'''
          text = re.sub(
              r"const TARGETS = \[.*?\n\];",
              targets,
              text,
              count=1,
              flags=re.S,
          )
          text = text.replace("const MAX_BODY_LINES = 220;", "const MAX_BODY_LINES = 260;")
          text = text.replace(
              "if (lineCount(nodeText) > 210 && children.length > 1) {",
              "if (lineCount(nodeText) > 175 && children.length > 0) {",
          )
          text = text.replace(
              'if (lineCount(childText) < 35 && lineCount(nodeText) < 280) continue;',
              'if (lineCount(childText) < 16 && lineCount(nodeText) < 260) continue;',
          )
          text = text.replace(
              "if (lineCount(nodeText) > 235) {",
              "if (lineCount(nodeText) > 275) {",
          )
          path.write_text(text)
          PY
      - name: Split writing result modules
        if: steps.prepare.outputs.status == '0'
        shell: bash
        run: |
          set +e
          node scripts/refactor_medium_ui_architecture.cjs > artifacts/writing-result-split.log 2>&1
          status=$?
          cat artifacts/writing-result-split.log
          echo "$status" > artifacts/writing-result-split.status
          exit 0
      - name: Commit worker result or diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend artifacts/writing-result-*.log artifacts/writing-result-*.status artifacts/medium-ui-architecture-report.tsv 2>/dev/null || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(writing): capture result refactor diagnostics"
          git push origin HEAD:${{ github.ref_name }}
