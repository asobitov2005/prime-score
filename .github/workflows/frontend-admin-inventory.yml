name: Frontend admin TypeScript map

on:
  push:
    branches:
      - refactor/frontend-admin-large-files-batch-1

permissions:
  contents: write

jobs:
  map:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install TypeScript toolchain
        working-directory: frontend
        run: npm ci
      - name: Generate TypeScript AST maps
        run: node scripts/map_typescript_modules.cjs
      - name: Commit maps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/typescript-module-map.json artifacts/typescript-module-map.tsv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: map large TypeScript modules"
          git push origin HEAD:${{ github.ref_name }}
