name: Safe TypeScript module splitter

on:
  push:
    branches:
      - refactor/frontend-admin-large-files-batch-1

permissions:
  contents: write

jobs:
  split:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install TypeScript toolchain
        working-directory: frontend
        run: npm ci
      - name: Split safe TypeScript modules
        run: node scripts/split_safe_typescript_modules.cjs
      - name: Commit generated modules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend admin artifacts/typescript-split-report.tsv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor(ui): split safe TypeScript modules"
          git push origin HEAD:${{ github.ref_name }}
