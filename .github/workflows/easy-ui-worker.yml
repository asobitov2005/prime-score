name: Easy UI worker

on:
  push:
    branches:
      - worker/easy-ui-final

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install TypeScript toolchain
        working-directory: frontend
        run: npm ci
      - name: Configure dashboard targets
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("scripts/refactor_medium_ui_architecture.cjs")
          text = path.read_text()
          targets = '''const TARGETS = [
            "frontend/app/(app)/dashboard/page.tsx",
            "admin/app/(dashboard)/dashboard/page.tsx",
            "admin/app/(dashboard)/analytics/page.tsx",
          ];'''
          text = re.sub(
              r"const TARGETS = \[.*?\n\];",
              targets,
              text,
              count=1,
              flags=re.S,
          )
          text = text.replace("const MAX_BODY_LINES = 220;", "const MAX_BODY_LINES = 260;")
          text = text.replace("if (lineCount(nodeText) > 235) {", "if (lineCount(nodeText) > 275) {")
          path.write_text(text)
          PY
      - name: Split dashboard pages
        run: node scripts/refactor_medium_ui_architecture.cjs
      - name: Commit worker result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend admin artifacts/medium-ui-architecture-report.tsv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor(ui): split remaining dashboard pages"
          git push origin HEAD:${{ github.ref_name }}
