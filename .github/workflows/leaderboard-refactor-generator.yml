name: Leaderboard refactor generator

on:
  push:
    branches:
      - refactor/backend-manual-large-functions

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Refactor leaderboard module
        run: python scripts/refactor_leaderboard.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/api/routes/leaderboard*.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor(leaderboard): split achievement catalog and routes"
          git push origin HEAD:${{ github.ref_name }}
