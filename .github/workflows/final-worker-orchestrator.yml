name: Final editor and exam workers

on:
  push:
    branches:
      - refactor/zero-oversized-source-files

permissions:
  contents: write

jobs:
  test-editor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/test-editor-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install TypeScript toolchain
        working-directory: frontend
        run: npm ci
      - name: Configure architecture generator
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("scripts/refactor_medium_ui_architecture.cjs")
          text = path.read_text()
          targets = '''const TARGETS = [
            "admin/components/test-editor-wizard.tsx",
          ];'''
          text = re.sub(r"const TARGETS = \[.*?\n\];", targets, text, count=1, flags=re.S)
          text = text.replace("const MAX_BODY_LINES = 220;", "const MAX_BODY_LINES = 270;")
          text = text.replace(
              "const controllerParts = packGroups(controllerUnits, groups, 255);",
              "const controllerParts = packGroups(controllerUnits, groups, 270);",
          )
          text = text.replace(
              "if (lineCount(nodeText) > 210 && children.length > 1) {",
              "if (lineCount(nodeText) > 145 && children.length > 0) {",
          )
          text = text.replace(
              'if (lineCount(childText) < 35 && lineCount(nodeText) < 280) continue;',
              'if (lineCount(childText) < 10 && lineCount(nodeText) < 230) continue;',
          )
          text = text.replace(
              "if (lineCount(nodeText) > 235) {",
              "if (lineCount(nodeText) > 285) {",
          )
          path.write_text(text)
          PY
      - name: Generate ContentPanel controller
        run: |
          rm -rf admin/components/test-editor-wizard-modules
          node scripts/refactor_medium_ui_architecture.cjs || true
      - name: Extract ContentPanel feature views
        run: node scripts/finish_test_editor_content_panel.cjs
      - name: Complete editor modules
        run: node scripts/refactor_medium_ui_architecture.cjs
      - name: Normalize generated contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          controller = Path("admin/components/test-editor-wizard-modules/content-panel/controller.tsx")
          text = controller.read_text()
          start = text.index("export function useContentPanelController(")
          body = text.index(") {", start)
          text = text[:start] + "export function useContentPanelController(props: Parameters<typeof useBaseScope>[0]) {" + text[body + 3:]
          controller.write_text(text)

          Path("admin/components/test-editor-wizard-modules/content-panel/index.tsx").write_text('''"use client";

import { useContentPanelController } from "./controller";
import { ContentPanelView } from "./view";

export function ContentPanel(
  props: Parameters<typeof useContentPanelController>[0],
) {
  const scope = useContentPanelController(props);
  return <ContentPanelView scope={scope} />;
}
''')
          PY
      - name: Commit test editor result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin artifacts/medium-ui-architecture-report.tsv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor(editor): complete test editor modules"
          git push origin HEAD:worker/test-editor-final

  reading-exam:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/reading-exam-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install TypeScript toolchain
        working-directory: frontend
        run: npm ci
      - name: Normalize effect placement
        run: node scripts/reorder_reading_exam_effects.cjs
      - name: Configure architecture generator
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("scripts/refactor_medium_ui_architecture.cjs")
          text = path.read_text()
          targets = '''const TARGETS = [
            "frontend/components/exam/reading-exam-preview.tsx",
          ];'''
          text = re.sub(r"const TARGETS = \[.*?\n\];", targets, text, count=1, flags=re.S)
          text = text.replace("const MAX_BODY_LINES = 220;", "const MAX_BODY_LINES = 285;")
          text = text.replace(
              "const controllerParts = packGroups(controllerUnits, groups, 255);",
              "const controllerParts = packGroups(controllerUnits, groups, 285);",
          )
          text = text.replace(
              "if (lineCount(nodeText) > 210 && children.length > 1) {",
              "if (lineCount(nodeText) > 145 && children.length > 0) {",
          )
          text = text.replace(
              'if (lineCount(childText) < 35 && lineCount(nodeText) < 280) continue;',
              'if (lineCount(childText) < 10 && lineCount(nodeText) < 230) continue;',
          )
          text = text.replace(
              "if (lineCount(nodeText) > 235) {",
              "if (lineCount(nodeText) > 285) {",
          )
          path.write_text(text)
          PY
      - name: Split reading exam modules
        run: node scripts/refactor_medium_ui_architecture.cjs
      - name: Commit reading exam result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend artifacts/medium-ui-architecture-report.tsv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor(reading): complete reading exam modules"
          git push origin HEAD:worker/reading-exam-final
