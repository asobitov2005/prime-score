name: Backend import graph

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  split-import-cycles:
    name: Split import cycles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check split-module import graph
        run: |
          set -o pipefail
          python backend/scripts/check_split_import_cycles.py 2>&1 | tee split-import-cycles.log
      - name: Upload cycle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: split-import-cycle-report
          path: split-import-cycles.log
