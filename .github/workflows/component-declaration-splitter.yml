name: Component declaration splitter

on:
  push:
    branches:
      - refactor/ui-component-modules-batch-2

permissions:
  contents: write

jobs:
  split:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install TypeScript toolchain
        working-directory: frontend
        run: npm ci
      - name: Split declaration-level component modules
        run: node scripts/split_component_declarations.cjs
      - name: Commit generated modules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend admin artifacts/component-declaration-split.tsv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor(ui): split component declarations"
          git push origin HEAD:${{ github.ref_name }}
