name: Example reading refactor generator

on:
  push:
    branches:
      - refactor/backend-manual-large-functions

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Split example reading builder
        run: python scripts/refactor_example_reading_seed.py
      - name: Commit generated modules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/admin_example_reading*.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor(seed): split example reading builder"
          git push origin HEAD:${{ github.ref_name }}
