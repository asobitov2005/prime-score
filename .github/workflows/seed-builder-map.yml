name: Seed builder map

on:
  push:
    branches:
      - refactor/backend-manual-large-functions

permissions:
  contents: write

jobs:
  map:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Generate statement map
        run: python scripts/map_seed_builder.py
      - name: Commit map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/admin-example-reading-statements.tsv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: map example reading builder statements"
          git push origin HEAD:${{ github.ref_name }}
