name: Admin module map

on:
  push:
    branches:
      - refactor/modularize-admin-routes

permissions:
  contents: write

jobs:
  map:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Generate map
        run: |
          python scripts/map_python_module.py \
            backend/app/api/routes/admin.py \
            artifacts/admin-module-map.json
      - name: Commit map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/admin-module-map.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: generate admin module AST map"
          git push origin HEAD:${{ github.ref_name }}
