name: Admin route refactor generator

on:
  push:
    branches:
      - refactor/modularize-admin-routes

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Generate route modules
        run: python scripts/refactor_admin_routes.py
      - name: Commit generated modules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/api/routes/admin*.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor(admin): split monolithic router by domain"
          git push origin HEAD:${{ github.ref_name }}
