name: Admin module map

on:
  push:
    branches:
      - refactor/modularize-admin-routes

permissions:
  contents: write

jobs:
  map:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Generate maps
        run: |
          python scripts/map_python_module.py \
            backend/app/api/routes/admin.py \
            artifacts/admin-module-map.json
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("backend/app/api/routes/admin.py")
          source = path.read_text()
          tree = ast.parse(source)
          rows = ["kind\tname\tstart\tend\troute"]
          for node in tree.body:
              name = getattr(node, "name", "")
              route = ""
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  for decorator in node.decorator_list:
                      call = decorator if isinstance(decorator, ast.Call) else None
                      target = call.func if call else decorator
                      if (
                          isinstance(target, ast.Attribute)
                          and isinstance(target.value, ast.Name)
                          and target.value.id == "router"
                      ):
                          if call and call.args and isinstance(call.args[0], ast.Constant):
                              route = str(call.args[0].value)
                          else:
                              route = "<dynamic>"
                          break
              if isinstance(node, (ast.Assign, ast.AnnAssign)):
                  targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                  name = ",".join(
                      target.id for target in targets if isinstance(target, ast.Name)
                  )
              rows.append(
                  f"{type(node).__name__}\t{name}\t{node.lineno}\t{node.end_lineno}\t{route}"
              )
          Path("artifacts/admin-module-map.tsv").write_text("\n".join(rows) + "\n")
          PY
      - name: Commit maps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/admin-module-map.json artifacts/admin-module-map.tsv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh admin module AST maps"
          git push origin HEAD:${{ github.ref_name }}
