name: Medium UI recursive section pass

on:
  push:
    branches:
      - refactor/zero-oversized-source-files

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install TypeScript toolchain
        working-directory: frontend
        run: npm ci
      - name: Configure recursive retry targets
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("scripts/refactor_medium_ui_architecture.cjs")
          text = path.read_text()
          targets = '''const TARGETS = [
            "admin/app/(dashboard)/promo-codes/page.tsx",
            "frontend/app/(app)/analytics/[skill]/skill-analytics-client.tsx",
            "frontend/components/layout/site-shell.tsx",
            "frontend/app/(app)/dashboard/streak-heatmap.tsx",
            "frontend/app/(app)/settings/page.tsx",
          ];'''
          text = re.sub(
              r"const TARGETS = \[.*?\n\];",
              targets,
              text,
              count=1,
              flags=re.S,
          )
          text = text.replace(
              "if (lineCount(nodeText) > 210 && children.length > 1) {",
              "if (lineCount(nodeText) > 180 && children.length > 0) {",
          )
          text = text.replace(
              'if (lineCount(childText) < 35 && lineCount(nodeText) < 280) continue;',
              'if (lineCount(childText) < 18 && lineCount(nodeText) < 235) continue;',
          )
          path.write_text(text)
          PY
      - name: Generate recursive view sections
        run: node scripts/refactor_medium_ui_architecture.cjs
      - name: Commit generated modules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend admin artifacts/medium-ui-architecture-report.tsv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor(ui): complete recursive medium view sections"
          git push origin HEAD:${{ github.ref_name }}
