name: Component dependency analysis

on:
  push:
    branches:
      - refactor/zero-oversized-source-files

permissions:
  contents: write

jobs:
  analyze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install TypeScript toolchain
        working-directory: frontend
        run: npm ci
      - name: Analyze component dependencies
        run: node scripts/analyze_component_dependencies.cjs
      - name: Commit analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/component-dependency-analysis.tsv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: analyze large component dependencies"
          git push origin HEAD:${{ github.ref_name }}
