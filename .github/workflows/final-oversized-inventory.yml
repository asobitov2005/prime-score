name: Medium UI architecture generator

on:
  push:
    branches:
      - refactor/zero-oversized-source-files

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install TypeScript toolchain
        working-directory: frontend
        run: npm ci
      - name: Generate medium UI architecture modules
        run: node scripts/refactor_medium_ui_architecture.cjs
      - name: Commit generated modules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend admin artifacts/medium-ui-architecture-report.tsv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor(ui): modularize medium UI architecture"
          git push origin HEAD:${{ github.ref_name }}
