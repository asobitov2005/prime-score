name: Parallel large component workers

on:
  push:
    branches:
      - refactor/zero-oversized-source-files

permissions:
  contents: write

jobs:
  analyze:
    if: github.actor != 'github-actions[bot]'
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: test-editor
            file: admin/components/test-editor-wizard.tsx
          - key: reading-exam
            file: frontend/components/exam/reading-exam-preview.tsx
          - key: speaking
            file: frontend/app/(app)/speaking/speaking-page-client.tsx
          - key: writing-result
            file: frontend/app/(app)/writing/submissions/[submissionId]/result/result-client.tsx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install TypeScript toolchain
        working-directory: frontend
        run: npm ci
      - name: Analyze ${{ matrix.key }}
        run: node scripts/map_large_component_worker.cjs "${{ matrix.file }}" "worker-output/${{ matrix.key }}.tsv"
      - uses: actions/upload-artifact@v4
        with:
          name: component-map-${{ matrix.key }}
          path: worker-output/${{ matrix.key }}.tsv

  aggregate:
    if: github.actor != 'github-actions[bot]'
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: component-map-*
          path: artifacts/large-component-maps
          merge-multiple: true
      - name: Commit worker maps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/large-component-maps
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: collect parallel large component maps"
          git push origin HEAD:${{ github.ref_name }}
