name: Backend quality

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: backend-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend runtime and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: primescore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d primescore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/primescore_test
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET: ci-user-access-secret
      JWT_REFRESH_SECRET: ci-user-refresh-secret
      TELEGRAM_BOT_TOKEN: change-me
      MINIO_ENDPOINT: 127.0.0.1:9200
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      PAYMENT_PAUSED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Migrate test database
        run: |
          set -o pipefail
          mkdir -p ../ci-logs
          alembic upgrade head 2>&1 | tee ../ci-logs/backend-migrate.log
      - name: Uvicorn smoke test
        run: |
          set -euo pipefail
          mkdir -p ../ci-logs
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../ci-logs/backend-uvicorn.log 2>&1 &
          uvicorn_pid=$!
          cleanup() {
            kill "$uvicorn_pid" 2>/dev/null || true
            wait "$uvicorn_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if ! kill -0 "$uvicorn_pid" 2>/dev/null; then
              cat ../ci-logs/backend-uvicorn.log
              exit 1
            fi
            if curl --fail --silent --show-error http://127.0.0.1:8000/openapi.json >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat ../ci-logs/backend-uvicorn.log
          exit 1
      - name: Ruff
        run: |
          set -o pipefail
          ruff check app tests --output-format=concise 2>&1 | tee ../ci-logs/backend-ruff.log
      - name: Pytest
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee ../ci-logs/backend-pytest.log
      - name: Upload backend logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality-logs
          path: ci-logs/backend-*
