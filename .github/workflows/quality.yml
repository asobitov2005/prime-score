name: Project quality

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  source-size:
    name: Source file size
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce 300-line limit for changed source files
        run: python scripts/check_changed_file_lengths.py

  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: primescore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d primescore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/primescore_test
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET: ci-user-access-secret
      JWT_REFRESH_SECRET: ci-user-refresh-secret
      TELEGRAM_BOT_TOKEN: change-me
      MINIO_ENDPOINT: 127.0.0.1:9200
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      PAYMENT_PAUSED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Migrate test database
        run: |
          mkdir -p ../ci-logs
          alembic upgrade head 2>&1 | tee ../ci-logs/backend-migrate.log
      - name: Ruff
        run: ruff check app tests --output-format=concise 2>&1 | tee ../ci-logs/backend-ruff.log
      - name: Pytest
        run: pytest -q 2>&1 | tee ../ci-logs/backend-pytest.log
      - name: Upload backend logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality-logs
          path: ci-logs/backend-*

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: /api
      API_INTERNAL_BASE_URL: http://127.0.0.1:8000/api
      NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: primescorebot
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: |
          mkdir -p ../ci-logs
          npm run lint 2>&1 | tee ../ci-logs/frontend-lint.log
      - name: Build
        run: npm run build 2>&1 | tee ../ci-logs/frontend-build.log
      - name: Upload frontend logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-quality-logs
          path: ci-logs/frontend-*

  admin:
    name: Admin lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_ADMIN_API_BASE_URL: /api/admin
      ADMIN_API_INTERNAL_BASE_URL: http://127.0.0.1:8000/api/admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: |
          mkdir -p ../ci-logs
          npm run lint 2>&1 | tee ../ci-logs/admin-lint.log
      - name: Build
        run: npm run build 2>&1 | tee ../ci-logs/admin-build.log
      - name: Upload admin logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-quality-logs
          path: ci-logs/admin-*

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate compose configuration
        run: docker compose config --quiet

  final-test-editor-worker:
    name: Final test editor worker
    if: github.event_name == 'pull_request' && github.head_ref == 'refactor/zero-oversized-source-files'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/test-editor-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install TypeScript toolchain
        working-directory: frontend
        run: npm ci
      - name: Configure architecture generator
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          path = Path("scripts/refactor_medium_ui_architecture.cjs")
          text = path.read_text()
          targets = '''const TARGETS = [
            "admin/components/test-editor-wizard.tsx",
          ];'''
          text = re.sub(r"const TARGETS = \[.*?\n\];", targets, text, count=1, flags=re.S)
          text = text.replace("const MAX_BODY_LINES = 220;", "const MAX_BODY_LINES = 270;")
          text = text.replace("const controllerParts = packGroups(controllerUnits, groups, 255);", "const controllerParts = packGroups(controllerUnits, groups, 270);")
          text = text.replace("if (lineCount(nodeText) > 210 && children.length > 1) {", "if (lineCount(nodeText) > 145 && children.length > 0) {")
          text = text.replace('if (lineCount(childText) < 35 && lineCount(nodeText) < 280) continue;', 'if (lineCount(childText) < 10 && lineCount(nodeText) < 230) continue;')
          text = text.replace("if (lineCount(nodeText) > 235) {", "if (lineCount(nodeText) > 285) {")
          path.write_text(text)
          PY
      - name: Generate ContentPanel controller
        run: |
          rm -rf admin/components/test-editor-wizard-modules
          node scripts/refactor_medium_ui_architecture.cjs || true
      - name: Extract ContentPanel feature views
        run: node scripts/finish_test_editor_content_panel.cjs
      - name: Complete editor modules
        run: node scripts/refactor_medium_ui_architecture.cjs
      - name: Normalize generated contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          controller = Path("admin/components/test-editor-wizard-modules/content-panel/controller.tsx")
          text = controller.read_text()
          start = text.index("export function useContentPanelController(")
          body = text.index(") {", start)
          text = text[:start] + "export function useContentPanelController(props: Parameters<typeof useBaseScope>[0]) {" + text[body + 3:]
          controller.write_text(text)
          Path("admin/components/test-editor-wizard-modules/content-panel/index.tsx").write_text('''"use client";

import { useContentPanelController } from "./controller";
import { ContentPanelView } from "./view";

export function ContentPanel(
  props: Parameters<typeof useContentPanelController>[0],
) {
  const scope = useContentPanelController(props);
  return <ContentPanelView scope={scope} />;
}
''')
          PY
      - name: Commit test editor result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin artifacts/medium-ui-architecture-report.tsv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor(editor): complete test editor modules"
          git push origin HEAD:worker/test-editor-final

  final-reading-exam-worker:
    name: Final reading exam worker
    if: github.event_name == 'pull_request' && github.head_ref == 'refactor/zero-oversized-source-files'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/reading-exam-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install TypeScript toolchain
        working-directory: frontend
        run: npm ci
      - name: Normalize effect placement
        run: node scripts/reorder_reading_exam_effects.cjs
      - name: Configure architecture generator
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          path = Path("scripts/refactor_medium_ui_architecture.cjs")
          text = path.read_text()
          targets = '''const TARGETS = [
            "frontend/components/exam/reading-exam-preview.tsx",
          ];'''
          text = re.sub(r"const TARGETS = \[.*?\n\];", targets, text, count=1, flags=re.S)
          text = text.replace("const MAX_BODY_LINES = 220;", "const MAX_BODY_LINES = 285;")
          text = text.replace("const controllerParts = packGroups(controllerUnits, groups, 255);", "const controllerParts = packGroups(controllerUnits, groups, 285);")
          text = text.replace("if (lineCount(nodeText) > 210 && children.length > 1) {", "if (lineCount(nodeText) > 145 && children.length > 0) {")
          text = text.replace('if (lineCount(childText) < 35 && lineCount(nodeText) < 280) continue;', 'if (lineCount(childText) < 10 && lineCount(nodeText) < 230) continue;')
          text = text.replace("if (lineCount(nodeText) > 235) {", "if (lineCount(nodeText) > 285) {")
          path.write_text(text)
          PY
      - name: Split reading exam modules
        run: node scripts/refactor_medium_ui_architecture.cjs
      - name: Commit reading exam result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend artifacts/medium-ui-architecture-report.tsv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor(reading): complete reading exam modules"
          git push origin HEAD:worker/reading-exam-final
