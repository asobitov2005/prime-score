name: Python batch 2 generator

on:
  push:
    branches:
      - refactor/backend-large-files-batch-2

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Split remaining Python modules
        run: python scripts/split_remaining_python.py
      - name: Commit generated modules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend artifacts/python-batch-2.tsv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor(backend): split remaining Python modules"
          git push origin HEAD:${{ github.ref_name }}
