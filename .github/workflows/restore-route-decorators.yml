name: Restore route decorators

on:
  push:
    branches:
      - agent/real-uvicorn-smoke

permissions:
  contents: write

jobs:
  restore:
    if: ${{ !startsWith(github.event.head_commit.message, 'autofix(routes):') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch with full history
        uses: actions/checkout@v4
        with:
          ref: agent/real-uvicorn-smoke
          fetch-depth: 0
      - name: Recover route decorators
        run: python scripts/restore_backend_route_decorators.py
      - name: Commit recovered decorators
        run: |
          if git diff --quiet; then
            echo "No route decorators needed restoration."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/api/routes
          git commit -m "autofix(routes): restore decorators lost by source split"
          git push origin HEAD:agent/real-uvicorn-smoke
