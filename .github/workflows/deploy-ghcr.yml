name: Build And Deploy

on:
  push:
    branches:
      - master
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'admin/**'
      - 'docker-compose.prod.yml'
      - 'scripts/deploy-prod.sh'
      - '.github/workflows/deploy-ghcr.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-prod
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  REPO_OWNER: asobitov2005
  DEPLOY_HOST: 84.247.183.218
  DEPLOY_USER: root
  DEPLOY_PATH: /root/projects/prime-score

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      deploy_files: ${{ steps.changes.outputs.deploy_files }}
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      admin: ${{ steps.changes.outputs.admin }}
      services: ${{ steps.changes.outputs.services }}
      image_tag: ${{ steps.changes.outputs.image_tag }}
      should_deploy: ${{ steps.changes.outputs.should_deploy }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: changes
        run: |
          BASE_SHA="${{ github.event.before }}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          if [ -n "$BASE_SHA" ]; then
            CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "${{ github.sha }}")"
          else
            CHANGED_FILES="$(git show --name-only --pretty='' "${{ github.sha }}")"
          fi

          echo "$CHANGED_FILES"

          deploy_files=false
          backend=false
          frontend=false
          admin=false

          if echo "$CHANGED_FILES" | grep -Eq '^(docker-compose\.prod\.yml|scripts/deploy-prod\.sh)$'; then
            deploy_files=true
          fi

          if echo "$CHANGED_FILES" | grep -Eq '^backend/'; then
            backend=true
          fi

          if echo "$CHANGED_FILES" | grep -Eq '^frontend/'; then
            frontend=true
          fi

          if echo "$CHANGED_FILES" | grep -Eq '^admin/'; then
            admin=true
          fi

          services=()
          if [ "$backend" = true ]; then
            services+=(api worker beat bot)
          fi
          if [ "$frontend" = true ]; then
            services+=(frontend)
          fi
          if [ "$admin" = true ]; then
            services+=(admin)
          fi

          if [ "$deploy_files" = true ] && [ "${#services[@]}" -eq 0 ]; then
            services=(api worker beat bot frontend admin)
          fi

          if [ "$backend" = true ] || [ "$frontend" = true ] || [ "$admin" = true ]; then
            image_tag="${{ github.sha }}"
          else
            image_tag=latest
          fi

          if [ "${#services[@]}" -gt 0 ] || [ "$deploy_files" = true ]; then
            should_deploy=true
          else
            should_deploy=false
          fi

          {
            echo "deploy_files=$deploy_files"
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "admin=$admin"
            echo "services=${services[*]}"
            echo "image_tag=$image_tag"
            echo "should_deploy=$should_deploy"
          } >> "$GITHUB_OUTPUT"

  build-backend:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/prime-score-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/prime-score-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=/api
            API_INTERNAL_BASE_URL=http://api:8000/api
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/prime-score-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/prime-score-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  build-admin:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.admin == 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Admin
        uses: docker/build-push-action@v6
        with:
          context: ./admin
          push: true
          build-args: |
            NEXT_PUBLIC_ADMIN_API_BASE_URL=/api/admin
            ADMIN_API_INTERNAL_BASE_URL=http://api:8000/api/admin
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/prime-score-admin:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/prime-score-admin:latest
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

  deploy:
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - build-backend
      - build-frontend
      - build-admin
    if: |
      always() &&
      needs.detect-changes.outputs.should_deploy == 'true' &&
      needs.build-backend.result != 'failure' &&
      needs.build-backend.result != 'cancelled' &&
      needs.build-frontend.result != 'failure' &&
      needs.build-frontend.result != 'cancelled' &&
      needs.build-admin.result != 'failure' &&
      needs.build-admin.result != 'cancelled'

    steps:
      - uses: actions/checkout@v4
        if: needs.detect-changes.outputs.deploy_files == 'true'

      - name: Load Deploy Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add Server To Known Hosts
        run: ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload Deploy Files
        if: needs.detect-changes.outputs.deploy_files == 'true'
        run: |
          scp docker-compose.prod.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.prod.yml"
          scp scripts/deploy-prod.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/scripts/deploy-prod.sh"

      - name: Run Deploy
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "\
            cd '$DEPLOY_PATH' && \
            chmod +x scripts/deploy-prod.sh && \
            IMAGE_TAG='${{ needs.detect-changes.outputs.image_tag }}' SERVICES='${{ needs.detect-changes.outputs.services }}' ./scripts/deploy-prod.sh\
          "
